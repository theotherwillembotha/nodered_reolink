
<script type="text/javascript" template-section="onCompose">
    node
        .addDefault("name", { value:"", required:false})
        .addDefault("reolinkconfig", {type:"ReolinkConfigNode", required:true})
        .addDefault("selectedDevices", {value:[]})
        .setIcon("reolink.png")
        .setPaletteLabel("Reolink Event")
        .setLabelStyle("node_label_white")
        .setLabel(function() {return this.name || 'reolink event' })
        .setColor("#0050E5")
        .addOutputs("event")
</script>

<div template-section="onIncludeOnce">
    <style>
        .node_label_white {
            fill:white
        }
    </style>
</div>

<script type="text/javascript" template-section="onIncludeEditPrepare">
{    
    let node = this;

    // at this point we want to get a list of devices that support "webhooks".
    // the only clever way to get it here would be to send a request to the ReolinkService and query it.

    // first, we need to ge the id of the reolink config.
    $("#node-input-reolinkconfig").on("change", () => {
        let reolinkServerInstanceId = $("#node-input-reolinkconfig").val();

        $.ajax({
            url: "reolinkservice/findDevices",
            type: "POST",
            contentType: "application/json; charset=utf-8",
            data:JSON.stringify({ id:reolinkServerInstanceId, ability:"webhookSupport" }),
            success: (response) => {
                let deviceSection = $("#node-input-availabledevices");
                deviceSection.children().remove();
                response.forEach(device => {
                    let checked =  !!node.selectedDevices.find(selected => selected === device.device);
                    let item = $(`<div>
                        <input type="checkbox" class="reolink_device" name="${device.device}" ${checked?"checked":""} style="width:15%"/>
                        <label style="width:auto">${device.name} (${device.device})</label>
                    </div>`);
                    item.appendTo(deviceSection);
                });
            },
            error: (jqXHR, textStatus, errorThrown) => {
                console.log(jqXHR, textStatus, errorThrown);
            }
        });
    });
}
</script>

<script type="text/javascript" template-section="onIncludeEditSave">
{
    let node = this;
    node.selectedDevices = [];
    $("#node-input-availabledevices")
        .find(".reolink_device")
        .filter((i, v) => v.checked)
        .each((i, v) => node.selectedDevices.push(v.name));
}
</script>

<script type="text/html" template-section="onIncludeEditForm">
    <div class="form-row">
        <label for="node-input-name" class="towb_editorlabel"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" />
    </div>

    <div class="form-row">
        <label for="node-input-reolinkconfig" class="towb_editorlabel"><i class="fa fa-cog"></i> Reolink Config</label>
        <input type="text" id="node-input-reolinkconfig" />
    </div>

    <div class="form-row">
        <label for="node-input-availabledevices" class="towb_editorlabel"><i class="fa fa-video-camera"></i> Selected Devices</label>
        <div id="node-input-availabledevices">
        </div>
    </div>
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
Receives motion and alarm events pushed from Reolink cameras via webhook. When a camera detects motion or triggers an alarm, this node outputs a Node-RED message containing the event payload.

Only devices that support webhooks will appear in the device selection list. Webhook support is determined per-device by querying the camera's capability flags on the linked config node.

### Properties

: *name*           (string) : Display label for this node.
: *reolink config* (config) : The Reolink Config node that manages the camera connections.
: *selected devices* (checkboxes) : The cameras to receive events from. Only webhook-capable devices are listed. Events from unchecked devices are ignored.

### Outputs

: *msg.payload* : The raw event payload delivered by the Reolink camera webhook. Structure varies by event type and firmware version.

### Notes

- At least one device must be selected, otherwise no messages will be emitted
- The linked config node must have a Webhook Server configured for event delivery to work
- Multiple Event nodes can reference the same config node and select different subsets of devices
</script>
